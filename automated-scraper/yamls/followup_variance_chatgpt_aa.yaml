defaults:
  query_file: ../benchmark_creation/results/aa-omniscience-subset-200.csv
  runs: 3
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0
  batch_size: 200
  pause_hours: 3

# Same-surface variance control:
# - duplicate interface sessions per UI model estimate session/routing variance
# - repeated runs estimate within-surface stochasticity
# - API workers are synchronized at the per-query barrier in sync mode
mode: sync

api_models:
  - model: gpt-5.3-chat-latest
    web_search: false
  - model: gpt-5.4-2026-03-05
    reasoning_effort: high
    web_search: false

experiments:
  - name: instant_rep1
    type: non-temporary
    interface_model: instant

  - name: instant_rep2
    type: non-temporary
    interface_model: instant

  - name: thinking_rep1
    type: non-temporary
    interface_model: gpt-5-4-thinking

  - name: thinking_rep2
    type: non-temporary
    interface_model: gpt-5-4-thinking
