# Layer 2 phase 2 — within-account session variance, ChatGPT instant, BBQ-200.
# 1 account x 3 sessions = 3 parallel sessions, all firing at the same wall-clock.

defaults:
  query_file: ../benchmark_creation/results/bbq-subset-200.csv
  runs: 1
  shuffle: false
  fast: true
  wait_after_prompts: 3
  wait_after_saves: 0

mode: sequential

experiments:
  - name: s1
    type: non-temporary
    interface_model: gpt-5-3-instant
  - name: s2
    type: non-temporary
    interface_model: gpt-5-3-instant
  - name: s3
    type: non-temporary
    interface_model: gpt-5-3-instant
