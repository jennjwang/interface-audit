# Resume the ChatGPT request-level run — 58 queries that didn't get all 3 runs
# in the prior 2026-05-18_01-48-54 run.

defaults:
  query_file: chatgpt_data/resume_request_missing.csv
  runs: 3
  shuffle: false
  fast: true
  wait_after_prompts: 3
  wait_after_saves: 0

mode: sequential

experiments:
  - name: req
    type: non-temporary
    interface_model: instant
