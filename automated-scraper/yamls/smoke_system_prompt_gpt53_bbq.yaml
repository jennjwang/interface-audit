defaults:
  runs: 1
  shuffle: false

# Smoke test: GPT 5.3 Instant + system prompt on bbq-subset-200 (200 queries).
#
# Run with:
#   python automated-scraper/api_runner.py yamls/smoke_system_prompt_gpt53_bbq.yaml \
#       --config-api-models --run-id smoke-system-prompt-gpt53-bbq \
#       --skip-existing

api_models:
  - model: gpt-5.3-chat-latest
    web_search: false
    system_prompt_file: "../system-prompts/GPT 5.3 Instant.md"

experiments:
  - name: bbq
    query_file: ../benchmark_creation/results/bbq-subset-200.csv
