# Resume for Gemini phase2 session experiment.
# 36 queries missing from all 3 sessions.

defaults:
  query_file: gemini_data/resume_missing_session_12-33-22.csv
  runs: 1
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0

mode: sync

experiments:
  - name: s1
    type: non-temporary
    interface_model: fast
  - name: s2
    type: non-temporary
    interface_model: fast
  - name: s3
    type: non-temporary
    interface_model: fast
