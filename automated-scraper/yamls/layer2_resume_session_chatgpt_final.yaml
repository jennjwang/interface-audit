# Resume for ChatGPT phase2 session experiment.
# Per-session query files: each session only runs questions it hasn't answered.
# s1: 76 missing, s2/s3: 189 missing (same file). Run with --resume to auto-skip
# any questions answered after the resume files were generated (2026-05-18 12:27).

defaults:
  runs: 1
  shuffle: false
  fast: true
  wait_after_prompts: 3
  wait_after_saves: 0

mode: sync

experiments:
  - name: s1
    type: non-temporary
    interface_model: gpt-5-3-instant
    query_file: chatgpt_data/resume_missing_session_s1_12-27-53.csv
  - name: s2
    type: non-temporary
    interface_model: gpt-5-3-instant
    query_file: chatgpt_data/resume_missing_session_s2_12-27-53.csv
  - name: s3
    type: non-temporary
    interface_model: gpt-5-3-instant
    query_file: chatgpt_data/resume_missing_session_s3_12-27-53.csv
