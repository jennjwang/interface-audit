defaults:
  rotate_query_files:
    - ../benchmark_creation/results/bbq-subset-200.csv
    - ../benchmark_creation/results/aa-omniscience-subset-200.csv
    - ../benchmark_creation/results/elephant-moral-flip-100.csv
    - ../benchmark_creation/results/elephant-moral-og-100.csv
  runs: 1
  num_runs: 5
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0

mode: sync

api_models:
  - model: gemini-3-flash-preview
    thinking_level: low
    web_search: false
  - model: gemini-3-flash-preview
    thinking_level: high
    web_search: false

experiments:
  - name: fast
    type: non-temporary
    interface_model: fast
  - name: thinking
    type: non-temporary
    interface_model: thinking
