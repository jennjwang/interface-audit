defaults:
  # query_file: ../experiments/aa-omniscience/queries.csv
  query_file: /home/jenn/automated-scraper/benchmark_creation/results/bbq-subset-10.csv
  runs: 1
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0

# "sync" = one browser session per experiment, all running in parallel with barrier sync
mode: sync

api_models:
  - model: gpt-5.3-chat-latest
    web_search: false
  - model: gpt-5.4-2026-03-05
    reasoning_effort: high
    web_search: false

experiments:
  - name: gpt-5-3-instant
    type: non-temporary
    interface_model: instant

  - name: gpt-5-4-thinking
    type: non-temporary
    interface_model: gpt-5.4-thinking
