defaults:
  query_file: ../experiments/sorrybench/queries/queries.csv
  runs: 1
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0

# "sync" = one browser session per experiment, all running in parallel with barrier sync
mode: sync

api_models:
  - model: gpt-5.3-chat-latest
  - model: gpt-5.4-2026-03-05
    reasoning_effort: high

experiments:
  - name: instant
    type: non-temporary
    interface_model: instant

  - name: thinking
    type: non-temporary
    interface_model: thinking

  - name: instant-control
    type: non-temporary
    interface_model: instant

  - name: thinking-control
    type: non-temporary
    interface_model: thinking
