defaults:
  # rotate_query_files:
  query_file: ../benchmark_creation/results/aa-omniscience-subset-200-from-287.csv
  runs: 1
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0

# "sync" = one browser session per experiment, all running in parallel with barrier sync
# "sequential" = all experiments run one-after-another in a single browser session
mode: sync

api_models:
  - model: gemini-3-flash-preview
    thinking_level: high
    web_search: false
  - model: gemini-3-flash-preview
    thinking_level: low
    web_search: false
  # - model: gemini-3.1-pro-preview

experiments:
  - name: fast
    type: non-temporary
    interface_model: fast

  - name: thinking
    type: non-temporary
    interface_model: thinking

  # - name: pro
  #   type: non-temporary
  #   interface_model: pro
