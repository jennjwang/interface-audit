defaults:
  # rotate_query_files:
  # - ../experiments/metabench-gsm8k/queries/queries_from_229.csv
  # - ../experiments/metabench-truthfulQA/queries/queries_from_72.csv
  # - ../experiments/metabench-gsm8k/queries/queries_from_158.csv
  # query_file: ../experiments/metabench-gsm8k/queries/queries_from_229.csv
  query_file: ../experiments/sorrybench/queries/queries.csv
  runs: 1
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0

# "sync" = one browser session per experiment, all running in parallel with barrier sync
# "sequential" = all experiments run one-after-another in a single browser session
mode: sync

api_models:
  - model: gemini-3-flash-preview
    thinking_level: high
  - model: gemini-3-flash-preview
    thinking_level: low
  # - model: gemini-3.1-pro-preview

experiments:
  - name: fast
    type: non-temporary
    interface_model: fast

  - name: thinking
    type: non-temporary
    interface_model: thinking

  # - name: pro
  #   type: non-temporary
  #   interface_model: pro
