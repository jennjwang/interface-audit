defaults:
  rotate_query_files:
    - ../benchmark_creation/results/bbq-subset-200.csv
    - ../benchmark_creation/results/aa-omniscience-subset-200.csv
    - ../benchmark_creation/results/elephant-moral-flip-100.csv
    - ../benchmark_creation/results/elephant-moral-og-100.csv
  runs: 1
  num_runs: 5
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0

mode: sync

api_models:
  - model: claude-haiku-4-5-20251001
    web_search: false
  - model: claude-sonnet-4-6
    web_search: false
  - model: claude-opus-4-6
    web_search: false

experiments:
  - name: haiku
    type: non-temporary
    interface_model: haiku-4-5
  - name: sonnet
    type: non-temporary
    interface_model: sonnet
  - name: opus
    type: non-temporary
    interface_model: opus
