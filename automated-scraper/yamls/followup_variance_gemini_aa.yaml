defaults:
  query_file: ../benchmark_creation/results/aa-omniscience-subset-200.csv
  runs: 3
  num_runs: 1
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0

# Same-surface variance control:
# duplicate interface sessions per UI model plus synchronized API workers.
mode: sync

api_models:
  - model: gemini-3-flash-preview
    thinking_level: low
    web_search: false
  - model: gemini-3-flash-preview
    thinking_level: high
    web_search: false

experiments:
  - name: fast_rep1
    type: non-temporary
    interface_model: fast

  - name: fast_rep2
    type: non-temporary
    interface_model: fast

  - name: thinking_rep1
    type: non-temporary
    interface_model: thinking

  - name: thinking_rep2
    type: non-temporary
    interface_model: thinking
