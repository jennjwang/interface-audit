defaults:
  query_file: ../benchmark_creation/results/aa-omniscience-subset-200.csv
  runs: 3
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0

# Same-surface variance control:
# duplicate interface sessions per UI model plus synchronized API workers.
mode: sync

api_models:
  - model: claude-haiku-4-5-20251001
    web_search: false
  - model: claude-sonnet-4-6
    web_search: false
  - model: claude-opus-4-7
    web_search: false

experiments:
  - name: haiku_rep1
    type: non-temporary
    interface_model: haiku

  - name: haiku_rep2
    type: non-temporary
    interface_model: haiku

  - name: sonnet_rep1
    type: non-temporary
    interface_model: sonnet

  - name: sonnet_rep2
    type: non-temporary
    interface_model: sonnet

  - name: opus_rep1
    type: non-temporary
    interface_model: opus

  - name: opus_rep2
    type: non-temporary
    interface_model: opus
