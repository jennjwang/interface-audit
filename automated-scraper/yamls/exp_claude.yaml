defaults:
  query_file: ../experiments/hle/queries/queries.csv
  rotate_query_files:
    - ../experiments/hle/queries/queries.csv
  runs: 1
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0

# "sync" = one browser session per experiment, all running in parallel with barrier sync
# "sequential" = all experiments run one-after-another in a single browser session
mode: sync

api_models:
  - model: claude-opus-4-6
  - model: claude-sonnet-4-6
  - model: claude-haiku-4-5-20251001

experiments:
  - name: haiku
    type: non-temporary
    interface_model: haiku

  - name: opus
    type: non-temporary
    interface_model: opus

  - name: sonnet
    type: non-temporary
    interface_model: sonnet
