# Routing-variance configs — account, session, and request-level variance.
# Used with audit scripts' --attach-port-base flag for multi-Chrome sessions.

# ── ChatGPT: request-level variance (1 account, 3 runs per question) ────
defaults:
  query_file: ../data/answer_keys/bbq-subset-200.csv
  runs: 3
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0

mode: sequential

experiments:
  - name: r1
    type: non-temporary
    interface_model: instant

