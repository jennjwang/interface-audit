# Fresh run for Gemini phase3 request experiment.
# Prior partial run (00-32-59) had 77/200 queries with run0 only.
# Run fresh for a clean 200x3 dataset.

defaults:
  query_file: ../benchmark_creation/results/bbq-subset-200.csv
  runs: 3
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0

mode: sequential

experiments:
  - name: req
    type: non-temporary
    interface_model: fast
