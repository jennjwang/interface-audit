defaults:
  query_file: ../experiments/toy.csv
  runs: 1
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0

# "sync" = one browser session per experiment, all running in parallel with barrier sync
# "sequential" = all experiments run one-after-another in a single browser session
mode: sync

experiments:
  - name: chat
    type: non-temporary
