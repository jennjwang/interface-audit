# Interface scraping configs — browser automation for each provider.
# Each section configures one provider+model combination for the audit scripts.
# Query file paths are relative to the original collection environment.

# ── ChatGPT: GPT 5.3 Instant ────────────────────────────────────────────
defaults:
  runs: 1
  num_runs: 5
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0
  batch_size: 150

mode: sync

api_models:
  - model: gpt-5.3-chat-latest
    web_search: false

experiments:
  - name: gpt-5-3-instant
    type: non-temporary
    interface_model: gpt-5-3-instant

---
