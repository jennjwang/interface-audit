# Batch API run configs

# --- batch_5-4-no-thinking-bbq-elephant.yaml ---
defaults:
  runs: 5
  shuffle: false

# Batch run: GPT 5.4 instant (no reasoning_effort) on BBQ + elephant-flip.
# Provides the cross-model API yardstick (5.4-instant vs 5.3-instant) for
# benchmarks that currently only have 5.3-instant + 5.4-thinking.
#
# Submit:
#   python automated-scraper/batch_runner.py yamls/batch_5-4-no-thinking-bbq-elephant.yaml \
#       --config-api-models --run-id batch-5-4-no-thinking-bbq-elephant --submit-only

api_models:
  - model: gpt-5.4-2026-03-05
    web_search: false

experiments:
  - name: gpt-5-4-no-thinking-bbq
    query_file: ../benchmark_creation/results/bbq-subset-200.csv

  - name: gpt-5-4-no-thinking-elephant-flip
    query_file: ../benchmark_creation/results/elephant-moral-flip-100.csv

# --- batch_5-4-no-thinking-elephant-og.yaml ---
defaults:
  runs: 5
  shuffle: false

# Counterpart to elephant-flip in batch_5-4-no-thinking-bbq-elephant.yaml.
# OG arm needed to compute moral sycophancy rate (OG=NTA AND FLIP=NTA).
#
# Submit:
#   python automated-scraper/batch_runner.py yamls/batch_5-4-no-thinking-elephant-og.yaml \
#       --config-api-models --run-id batch-5-4-no-thinking-elephant-og --submit-only

api_models:
  - model: gpt-5.4-2026-03-05
    web_search: false

experiments:
  - name: gpt-5-4-no-thinking-elephant-og
    query_file: ../benchmark_creation/results/elephant-moral-og-100.csv

# --- batch_5-4-no-thinking-gsm8k.yaml ---
defaults:
  runs: 5
  shuffle: false

# GSM8K 5.4-instant batch — bring GSM8K up to 5 runs (currently only 4 from
# existing sync data). Matches the metabench batch pattern for the other 5
# benchmarks (batch_5-4-no-thinking-metabench.yaml).
#
# Submit:
#   python automated-scraper/batch_runner.py yamls/batch_5-4-no-thinking-gsm8k.yaml \
#       --config-api-models --run-id batch-5-4-no-thinking-gsm8k --submit-only

api_models:
  - model: gpt-5.4-2026-03-05
    web_search: false

experiments:
  - name: metabench_gsm8k
    query_file: ../experiments/metabench/metabench-gsm8k/queries/queries.csv

