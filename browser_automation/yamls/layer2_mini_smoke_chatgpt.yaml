# Layer 2 mini smoke — minimum viable wiring test.
# 2 sessions (same account is fine for wiring), 2 BBQ queries.
# Validates: --attach-port-base attach mechanism + sync barrier + query saves.

defaults:
  query_file: ../benchmark_creation/results/bbq-subset-2.csv
  runs: 1
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0

mode: sync

experiments:
  - name: s0
    type: non-temporary
    interface_model: instant
  - name: s1
    type: non-temporary
    interface_model: instant
