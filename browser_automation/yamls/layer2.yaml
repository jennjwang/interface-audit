# Layer 2 configs (account/session/request variance)

# --- layer2_request_chatgpt_instant_bbq.yaml ---
# Layer 2 phase 3 — request-level variance, ChatGPT instant, BBQ-200.
# 1 account, 1 session, 3 runs per question. Tests stochastic variance
# within the same account and session.

defaults:
  query_file: ../benchmark_creation/results/bbq-subset-200.csv
  runs: 3
  shuffle: false
  fast: true
  wait_after_prompts: 3
  wait_after_saves: 0

mode: sequential

experiments:
  - name: req
    type: non-temporary
    interface_model: instant

# --- layer2_request_claude_haiku_bbq.yaml ---
# Layer 2 phase 3 — request-level variance, Claude haiku, BBQ-200.
# 1 account, 1 session, 3 runs per question. Tests stochastic variance
# within the same account and session.

defaults:
  query_file: ../benchmark_creation/results/bbq-subset-200.csv
  runs: 3
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0

mode: sequential

experiments:
  - name: req
    type: non-temporary
    interface_model: haiku

# --- layer2_request_gemini_fast_bbq.yaml ---
# Layer 2 phase 3 — request-level variance, Gemini fast, BBQ-200.
# 1 account, 1 session, 3 runs per question. Tests stochastic variance
# within the same account and session.

defaults:
  query_file: gemini_data/resume_request_missing.csv
  runs: 3
  shuffle: false
  fast: true
  wait_after_prompts: 3
  wait_after_saves: 0

mode: sequential

experiments:
  - name: req
    type: non-temporary
    interface_model: 3 flash

# --- layer2_session_chatgpt_instant_bbq.yaml ---
# Layer 2 phase 2 — within-account session variance, ChatGPT instant, BBQ-200.
# 1 account x 3 sessions = 3 parallel sessions, all firing at the same wall-clock.

defaults:
  query_file: ../benchmark_creation/results/bbq-subset-200.csv
  runs: 1
  shuffle: false
  fast: true
  wait_after_prompts: 3
  wait_after_saves: 0

mode: sequential

experiments:
  - name: s1
    type: non-temporary
    interface_model: gpt-5-3-instant
  - name: s2
    type: non-temporary
    interface_model: gpt-5-3-instant
  - name: s3
    type: non-temporary
    interface_model: gpt-5-3-instant

# --- layer2_session_claude_haiku_bbq.yaml ---
# Layer 2 phase 2 — within-account session variance, Claude haiku, BBQ-200.
