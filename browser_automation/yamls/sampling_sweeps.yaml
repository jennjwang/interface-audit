# Sampling and reasoning sweep configs.
# Each model is tested with temperature, top_p, or reasoning effort variations.
# Axes are varied independently (not a full grid).

# ── Claude Haiku: BBQ sampling sweep ─────────────────────────────────────
defaults: {runs: 3, shuffle: false}
api_models:
  - {model: claude-haiku-4-5-20251001, max_tokens: 1024, temperature: 0.0}
  - {model: claude-haiku-4-5-20251001, max_tokens: 1024, temperature: 0.5}
  - {model: claude-haiku-4-5-20251001, max_tokens: 1024, temperature: 0.7}
  - {model: claude-haiku-4-5-20251001, max_tokens: 1024, top_p: 0.9}
  - {model: claude-haiku-4-5-20251001, max_tokens: 1024, top_p: 0.95}
experiments:
  - {name: bbq, query_file: ../data/answer_keys/bbq-subset-200.csv}

