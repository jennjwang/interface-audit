defaults:
  runs: 5
  shuffle: false

# claude-opus-4-7 with matching Claude Opus 4.7 system prompt on aa-omni + bbq.
api_models:
  - model: claude-opus-4-7
    web_search: false
    system_prompt_file: "../system-prompts/Claude Opus 4.7.md"

experiments:
  - name: aa_omniscience
    query_file: ../benchmark_creation/results/aa-omniscience-subset-200.csv
  - name: bbq
    query_file: ../benchmark_creation/results/bbq-subset-200.csv
