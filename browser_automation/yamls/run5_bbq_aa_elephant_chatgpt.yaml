defaults:
  rotate_query_files:
    - ../benchmark_creation/results/bbq-subset-200.csv
    - ../benchmark_creation/results/aa-omniscience-subset-200.csv
    - ../benchmark_creation/results/elephant-moral-flip-100.csv
    - ../benchmark_creation/results/elephant-moral-og-100.csv
  runs: 1
  num_runs: 5
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0
  batch_size: 150
  pause_hours: 3

mode: sync

api_models:
  - model: gpt-5.3-chat-latest
    web_search: false
  - model: gpt-5.4-2026-03-05
    reasoning_effort: high
    web_search: false

experiments:
  - name: gpt-5-3-instant
    type: non-temporary
    interface_model: gpt-5-3-instant
  - name: gpt-5-4-thinking
    type: non-temporary
    interface_model: gpt-5-4-thinking
