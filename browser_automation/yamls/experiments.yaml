# Main experiment configs (interface scraping)
# Each section was originally a separate YAML file.

# --- exp_chatgpt_5-3-instant.yaml ---
defaults:
  rotate_query_files:
    # 5-3-instant API backfill:
    # Completed before 2026-05-12 crash (commented out):
    # - ../benchmark_creation/results/5-3-instant-api-aa-omni-tier1.csv       # 200 [DONE 2026-05-12_00-00-19]
    # - ../benchmark_creation/results/5-3-instant-api-elephant-flip-tier1.csv # 100 [DONE 2026-05-12_00-00-19]
    # - ../benchmark_creation/results/5-3-instant-api-aa-omni-tier2-remaining.csv #  0 [DONE — all 198 completed across runs]
    - ../benchmark_creation/results/5-3-instant-api-elephant-flip-tier2.csv # 100
    - ../benchmark_creation/results/5-3-instant-api-aa-omni-tier3.csv       #  50
    - ../benchmark_creation/results/5-3-instant-api-elephant-flip-tier3.csv # 100
    - ../benchmark_creation/results/5-3-instant-api-elephant-og-tier1.csv   #  36
    - ../benchmark_creation/results/5-3-instant-api-aa-omni-tier4.csv       #   1
  runs: 1
  num_runs: 1
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0
  batch_size: 150
  pause_hours: 3

mode: sync

api_models:
  - model: gpt-5.3-chat-latest
    web_search: false

experiments:
  - name: gpt-5-3-instant
    type: non-temporary
    interface_model: gpt-5-3-instant

# --- exp_chatgpt_5-4-no-thinking-bbq-elephant.yaml ---
defaults:
  runs: 5
  num_runs: 5
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0
  batch_size: 150
  pause_hours: 3

mode: sync

api_models:
  - model: gpt-5.4-2026-03-05
    web_search: false

experiments:
  - name: gpt-5-4-no-thinking-bbq
    query_file: ../benchmark_creation/results/bbq-subset-200.csv
  - name: gpt-5-4-no-thinking-elephant-flip
    query_file: ../benchmark_creation/results/elephant-moral-flip-100.csv

# --- exp_chatgpt_5-4-no-thinking.yaml ---
defaults:
  query_file: ../benchmark_creation/results/aa-omniscience-subset-200.csv
  runs: 4
  num_runs: 4
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0
  batch_size: 150
  pause_hours: 3

mode: sync

# Same parameters as gpt-5.3-chat-latest: web_search disabled, no reasoning_effort.
# Whatever the API defaults to for reasoning on gpt-5.4 will be applied.
