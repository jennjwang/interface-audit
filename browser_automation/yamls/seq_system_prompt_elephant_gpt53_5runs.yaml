defaults:
  runs: 5
  shuffle: false

# 5-runs sequential fallback for GPT 5.3 Instant on elephant pairs.
# GPT 5.3 isn't supported by OpenAI's Batch API, so we run sequentially
# under the same run-id as the elephant batch so output dirs interleave.
#
#   python automated-scraper/api_runner.py yamls/seq_system_prompt_elephant_gpt53_5runs.yaml \
#       --config-api-models --run-id batch-system-prompt-elephant-5runs \
#       --skip-existing

api_models:
  - model: gpt-5.3-chat-latest
    web_search: false
    system_prompt_file: "../system-prompts/GPT 5.3 Instant.md"

experiments:
  - name: elephant_og
    query_file: ../benchmark_creation/results/elephant-moral-og-100.csv
  - name: elephant_flip
    query_file: ../benchmark_creation/results/elephant-moral-flip-100.csv
