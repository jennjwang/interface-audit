defaults:
  runs: 5
  shuffle: false

# claude-opus-4-6 + Claude Opus 4.6 system prompt on aa-omni, bbq, and elephant
# (og + flip).
#
#   python automated-scraper/batch_runner.py yamls/batch_opus46_aa_bbq_elephant_5runs.yaml \
#       --config-api-models --run-id batch-opus46-sysprompt-aa-bbq-elephant-5runs

api_models:
  - model: claude-opus-4-6
    web_search: false
    system_prompt_file: "../system-prompts/Claude Opus 4.6.md"

experiments:
  - name: aa_omniscience
    query_file: ../benchmark_creation/results/aa-omniscience-subset-200.csv
  - name: bbq
    query_file: ../benchmark_creation/results/bbq-subset-200.csv
  - name: elephant_og
    query_file: ../benchmark_creation/results/elephant-moral-og-100.csv
  - name: elephant_flip
    query_file: ../benchmark_creation/results/elephant-moral-flip-100.csv
