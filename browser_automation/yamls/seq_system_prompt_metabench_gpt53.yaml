defaults:
  runs: 1
  shuffle: false

# Sequential fallback for GPT 5.3 Instant on all metabench (Batch API doesn't
# support gpt-5.3-chat-latest as of 2026-05-13).
#
# Run with:
#   python automated-scraper/api_runner.py yamls/seq_system_prompt_metabench_gpt53.yaml \
#       --config-api-models --run-id batch-system-prompt-metabench \
#       --skip-existing

api_models:
  - model: gpt-5.3-chat-latest
    web_search: false
    system_prompt_file: "../system-prompts/GPT 5.3 Instant.md"

experiments:
  - name: metabench_mmlu
    query_file: ../experiments/metabench/metabench-mmlu/queries/queries.csv
  - name: metabench_arc
    query_file: ../experiments/metabench/metabench-arc/queries/queries.csv
  - name: metabench_gsm8k
    query_file: ../experiments/metabench/metabench-gsm8k/queries/queries.csv
  - name: metabench_hellaswag
    query_file: ../experiments/metabench/metabench-hellaswag/queries/queries.csv
  - name: metabench_truthfulqa
    query_file: ../experiments/metabench/metabench-truthfulQA/queries/queries.csv
  - name: metabench_winogrande
    query_file: ../experiments/metabench/metabench-winogrande/queries/queries.csv
