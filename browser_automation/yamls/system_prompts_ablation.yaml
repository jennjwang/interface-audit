defaults:
  runs: 1
  shuffle: false

# API-only ablation comparing baseline (no system prompt) vs. provider-extracted
# system prompts in ../system-prompts/. Each api_model is duplicated:
#   1. baseline — matches the params used in existing exp_*/followup_variance_* yamls
#   2. with system_prompt_file — same params + provider system prompt
#
# Run with:
#   python automated-scraper/api_runner.py yamls/system_prompts_ablation.yaml \
#       --config-api-models --run-id system-prompts-ablation \
#       --skip-existing
#
# Add --skip-existing if resuming. Models run as parallel processes; experiments
# run sequentially within each model. Outputs land in data/api/<run_id>/<model_dir>/session_00/<exp_name>/.

api_models:
  # ── GPT 5.3 Instant (gpt-5.3-chat-latest) ────────────────────────────────
  - model: gpt-5.3-chat-latest
    web_search: false
  - model: gpt-5.3-chat-latest
    web_search: false
    system_prompt_file: "../system-prompts/GPT 5.3 Instant.md"

  # ── GPT 5.4 Thinking (gpt-5.4-2026-03-05, reasoning_effort: high) ────────
  - model: gpt-5.4-2026-03-05
    reasoning_effort: high
    web_search: false
  - model: gpt-5.4-2026-03-05
    reasoning_effort: high
    web_search: false
    system_prompt_file: "../system-prompts/GPT 5.4 Thinking.md"

  # ── Claude Opus 4.7 ──────────────────────────────────────────────────────
  - model: claude-opus-4-7
    web_search: false
  - model: claude-opus-4-7
    web_search: false
    system_prompt_file: "../system-prompts/Claude Opus 4.7.md"

  # ── Claude Sonnet 4.6 ────────────────────────────────────────────────────
  - model: claude-sonnet-4-6
    web_search: false
  - model: claude-sonnet-4-6
    web_search: false
    system_prompt_file: "../system-prompts/Claude Sonnet 4.6.md"

  # ── Gemini 3 Flash (thinking_level: high) ────────────────────────────────
  - model: gemini-3-flash-preview
    thinking_level: high
    web_search: false
  - model: gemini-3-flash-preview
    thinking_level: high
    web_search: false
    system_prompt_file: "../system-prompts/Gemini 3 Flash.md"

  # ── Gemini 3 Flash (thinking_level: low — the "fast" config) ─────────────
  # The system-prompts/Gemini 3 Flash.md prompt is the same; only the
  # thinking_level differs. Remove this pair if you only want one variant.
  - model: gemini-3-flash-preview
    thinking_level: low
    web_search: false
  - model: gemini-3-flash-preview
    thinking_level: low
    web_search: false
    system_prompt_file: "../system-prompts/Gemini 3 Flash.md"

experiments:
  - name: aa_omniscience
    query_file: ../benchmark_creation/results/aa-omniscience-subset-200.csv

  - name: elephant_flip
    query_file: ../benchmark_creation/results/elephant-moral-flip-100.csv

  - name: bbq
    query_file: ../benchmark_creation/results/bbq-subset-200.csv

  - name: metabench_mmlu
    query_file: ../experiments/metabench/metabench-mmlu/queries/queries.csv

  - name: metabench_arc
    query_file: ../experiments/metabench/metabench-arc/queries/queries.csv

  - name: metabench_gsm8k
    query_file: ../experiments/metabench/metabench-gsm8k/queries/queries.csv

  - name: metabench_hellaswag
    query_file: ../experiments/metabench/metabench-hellaswag/queries/queries.csv

  - name: metabench_truthfulqa
    query_file: ../experiments/metabench/metabench-truthfulQA/queries/queries.csv

  - name: metabench_winogrande
    query_file: ../experiments/metabench/metabench-winogrande/queries/queries.csv
