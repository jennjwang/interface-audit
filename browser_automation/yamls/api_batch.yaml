# Batch API run configs — submitted via runners/batch_runner.py.
# Uses OpenAI/Anthropic Batch APIs (50% cheaper, async).

# ── GPT 5.4 No-Thinking: metabench ──────────────────────────────────────
defaults: {runs: 5, shuffle: false}
api_models:
  - {model: gpt-5.4-2026-03-05, web_search: false}
experiments:
  - {name: metabench_mmlu}
  - {name: metabench_arc}
  - {name: metabench_gsm8k}
  - {name: metabench_hellaswag}
  - {name: metabench_truthfulqa}
  - {name: metabench_winogrande}

---
# ── GPT 5.4 No-Thinking: BBQ + Elephant ─────────────────────────────────
defaults: {runs: 5, shuffle: false}
api_models:
  - {model: gpt-5.4-2026-03-05, web_search: false}
experiments:
  - {name: bbq, query_file: ../data/answer_keys/bbq-subset-200.csv}
  - {name: elephant_flip, query_file: ../data/answer_keys/elephant-moral-flip-100.csv}

---
