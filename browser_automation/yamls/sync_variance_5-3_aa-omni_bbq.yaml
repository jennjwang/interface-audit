defaults:
  runs: 5
  num_runs: 5
  shuffle: false
  fast: true
  wait_after_prompts: 0
  wait_after_saves: 0
  batch_size: 150

# OpenAI Batch API doesn't accept gpt-5.3-chat-latest (no dated version exists),
# so we use the sync api_runner to add 5-run variance for 5.3 on AA-Omni + BBQ.
#
# Submit:
#   python automated-scraper/api_runner.py yamls/sync_variance_5-3_aa-omni_bbq.yaml \
#       --config-api-models --run-id sync-variance-5-3-aa-omni-bbq

api_models:
  - model: gpt-5.3-chat-latest
    web_search: false

experiments:
  - name: variance-5-3-aa-omni
    query_file: ../benchmark_creation/results/aa-omniscience-subset-200.csv

  - name: variance-5-3-bbq
    query_file: ../benchmark_creation/results/bbq-subset-200.csv
