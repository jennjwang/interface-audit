# Layer 2 phase 3 — request-level variance, ChatGPT instant, BBQ-200.
# 1 account, 1 session, 3 runs per question. Tests stochastic variance
# within the same account and session.

defaults:
  query_file: ../benchmark_creation/results/bbq-subset-200.csv
  runs: 3
  shuffle: false
  fast: true
  wait_after_prompts: 3
  wait_after_saves: 0

mode: sequential

experiments:
  - name: req
    type: non-temporary
    interface_model: instant
