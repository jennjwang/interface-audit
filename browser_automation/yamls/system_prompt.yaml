# System prompt ablation — baseline vs provider-extracted system prompts.
# Each model is tested with and without the leaked system prompt.
# Run with: python api_runner.py yamls/system_prompt.yaml --config-api-models --run-id <id>

defaults: {runs: 1, shuffle: false}

api_models:
  # GPT 5.3 Instant
  - {model: gpt-5.3-chat-latest, web_search: false}
  - {model: gpt-5.3-chat-latest, web_search: false, system_prompt_file: "../system-prompts/GPT 5.3 Instant.md"}

  # GPT 5.4 Thinking
  - {model: gpt-5.4-2026-03-05, reasoning_effort: high, web_search: false}
  - {model: gpt-5.4-2026-03-05, reasoning_effort: high, web_search: false, system_prompt_file: "../system-prompts/GPT 5.4 Thinking.md"}

  # Claude Opus 4.7
  - {model: claude-opus-4-7, web_search: false}
  - {model: claude-opus-4-7, web_search: false, system_prompt_file: "../system-prompts/Claude Opus 4.7.md"}

  # Claude Sonnet 4.6
  - {model: claude-sonnet-4-6, web_search: false}
  - {model: claude-sonnet-4-6, web_search: false, system_prompt_file: "../system-prompts/Claude Sonnet 4.6.md"}

  # Gemini 3 Flash (thinking: high)
  - {model: gemini-3-flash-preview, thinking_level: high, web_search: false}
  - {model: gemini-3-flash-preview, thinking_level: high, web_search: false, system_prompt_file: "../system-prompts/Gemini 3 Flash.md"}

  # Gemini 3 Flash (thinking: low)
  - {model: gemini-3-flash-preview, thinking_level: low, web_search: false}
  - {model: gemini-3-flash-preview, thinking_level: low, web_search: false, system_prompt_file: "../system-prompts/Gemini 3 Flash.md"}

experiments:
  - {name: aa_omniscience, query_file: ../data/answer_keys/aa-omniscience-subset-200.csv}
  - {name: elephant_flip, query_file: ../data/answer_keys/elephant-moral-flip-100.csv}
  - {name: bbq, query_file: ../data/answer_keys/bbq-subset-200.csv}
  - {name: metabench_mmlu}
  - {name: metabench_arc}
  - {name: metabench_gsm8k}
  - {name: metabench_hellaswag}
  - {name: metabench_truthfulqa}
  - {name: metabench_winogrande}
